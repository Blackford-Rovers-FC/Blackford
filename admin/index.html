```html
<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackford Rovers FC — Owner Area</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>
<script>
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.open();
            }
        });

        window.netlifyIdentity.on("login", () => {
            window.location.reload();
        });

        window.netlifyIdentity.on("logout", () => {
            window.location.reload();
        });
    }
</script>

    <header class="admin-header">
        <h1>Blackford Rovers FC</h1>
        <p>Owner Area</p>
    </header>

    <main class="admin-container">

        <section class="welcome">
            <h2>Owner Dashboard</h2>
            <p>Manage your Blackford Rovers FC website.</p>
        </section>

        <section class="admin-grid">

            <button class="admin-card">
                <span>⚽</span>
                <h3>Fixtures</h3>
                <p>Add and manage fixtures</p>
            </button>

            <button class="admin-card">
                <span>🏆</span>
                <h3>Results</h3>
                <p>Add match results</p>
            </button>

            <button class="admin-card">
                <span>📰</span>
                <h3>News</h3>
                <p>Create club news</p>
            </button>

            <button class="admin-card">
                <span>🔄</span>
                <h3>Transfers</h3>
                <p>Manage transfers</p>
            </button>

            <button class="admin-card">
                <span>📊</span>
                <h3>League Table</h3>
                <p>Manage league information</p>
            </button>

        </section>

    </main>

</body>
</html>
