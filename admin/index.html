```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackford Rovers FC — Owner Area</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

    <header class="admin-header">
        <div>
            <h1>Blackford Rovers FC</h1>
            <p>Owner Area</p>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Log Out
        </button>
    </header>

    <main class="admin-container">

        <section class="welcome">
            <h2>Owner Dashboard</h2>
            <p id="ownerEmail">Checking owner account...</p>
        </section>

        <section class="admin-grid">

            <a href="fixtures.html" class="admin-card">
                <span>⚽</span>
                <h3>Fixtures</h3>
                <p>Add and manage fixtures</p>
            </a>

            <a href="results.html" class="admin-card">
                <span>🏆</span>
                <h3>Results</h3>
                <p>Add match results</p>
            </a>

            <a href="news.html" class="admin-card">
                <span>📰</span>
                <h3>News</h3>
                <p>Create club news</p>
            </a>

            <a href="transfers.html" class="admin-card">
                <span>🔄</span>
                <h3>Transfers</h3>
                <p>Manage transfers</p>
            </a>

            <a href="table.html" class="admin-card">
                <span>📊</span>
                <h3>League Table</h3>
                <p>Manage league information</p>
            </a>

        </section>

    </main>

    <script>
        const ownerEmail = document.getElementById("ownerEmail");
        const logoutBtn = document.getElementById("logoutBtn");

        function checkUser() {
            const user = window.netlifyIdentity.currentUser();

            if (!user) {
                window.netlifyIdentity.open();
                return;
            }

            ownerEmail.textContent = "Logged in as: " + user.email;
        }

        logoutBtn.addEventListener("click", () => {
            window.netlifyIdentity.logout();
        });

        window.netlifyIdentity.on("init", checkUser);

        window.netlifyIdentity.on("login", () => {
            window.location.reload();
        });

        window.netlifyIdentity.on("logout", () => {
            window.location.reload();
        });
    </script>

</body>
</html>
```
